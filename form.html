<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Compra</title>
    <link rel="stylesheet" href="Styles_form.css">
    <header>
        <div class="header-form">
            <h1>Formulario de Compra</h1>
        </div>
    </header>
</head>

<body>


    <div class="form-wrapper">
        <form action="" id="contact_form">
            <div class="seccion-nombre">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="seccion-apellido">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
            </div>

            <div class="seccion-edad">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="21" max="60" step="1" placeholder="Tu Edad" required>
            </div>

            <div class="seccion-DNI">
                <label for="dni">DNI</label>
                <input type="number" id="dni" name="dni" placeholder="12345678" required>
            </div>

            <div class="seccion-email">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" placeholder="example@example.com" required>
            </div>

            <div class="seccion-tel">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+54 3496 123456" required>
            </div>

            <div class="form-actions">
                <button type="submit">Enviar</button>
            </div>

        </form>
    </div>
    </form>
</body>

</html>
